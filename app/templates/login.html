<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – AI Job Matcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0a2540 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.40);
      width: 100%;
      max-width: 400px;
      padding: 48px 40px 40px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -.5px;
    }
    .brand h1 span { color: #f5a623; }
    .brand p {
      margin-top: 4px;
      font-size: .82rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: .92rem;
      color: #111827;
      background: #f9fafb;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #0a66c2;
      box-shadow: 0 0 0 3px rgba(10,102,194,.15);
      background: #fff;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .84rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0a66c2, #0550a0);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .3px;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-login:hover  { opacity: .92; }
    .btn-login:active { transform: scale(.98); }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: .78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">🤖</span>
      <h1>AI Job<span> Matcher</span></h1>
      <p>Sign in to access your dashboard</p>
    </div>

    {% if error %}
    <div class="error-box">
      <span>⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <p class="footer-note">AI Job Matcher &mdash; Automated Pipeline</p>
  </div>
</body>
</html>
